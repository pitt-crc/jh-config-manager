[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "jh-config-manager"
version = "0.0.0"  # Version is set dynamically by the CI tool on publication
authors = ["Pitt Center for Research Computing and Data", ]
license = "GPL-3.0-only"
readme = "README.md"
description = "Dynamic JupyterHub config manager service."
keywords = ["Pitt", "CRC", "Jupyter", "JupyterHub", "JupyterLab", "Configuration", "Manager"]
classifiers = [
    "Intended Audience :: System Administrators",
    "Topic :: System :: Systems Administration",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]

[tool.poetry.scripts]
jh-config-manager = "jh_config_manager.__main__:main"

[tool.poetry.dependencies]
python = ">=3.10"
jupyterhub = "*"
tornado = "*"
traitlets = "*"
cffi = ">=1.17.1,<3.0.0"
cryptography = ">=45.0.7,<51.0.0"

[tool.poetry.group.tests]
optional = true

[tool.poetry.group.tests.dependencies]
coverage = "*"
